<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Aura CRM · Fletes Tauro</title>
  <meta name="description" content="Plataforma comercial inteligente de Fletes Tauro." />
  <script>
    // Fija el tema antes de la primera pintura: si esperara a React, la app
    // aparecería en claro un instante antes de cambiar a oscuro.
    (function () {
      try {
        var g = localStorage.getItem('aura.tema');
        var t = g ? JSON.parse(g) : 'sistema';
        var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body><div id="raiz"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
