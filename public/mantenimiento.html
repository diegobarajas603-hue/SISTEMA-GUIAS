<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sitio en mantenimiento - Fletes Tauro</title>
<style>
  /* Misma paleta que la pagina de rastreo del cliente */
  :root {
    --crema: #F6F4F1;
    --superficie: #FFFFFF;
    --linea: #E6E1DA;
    --texto: #1C1917;
    --texto-2: #57534E;
    --texto-3: #8B847C;
    --vino: #BE1D38;
    --vino-hover: #9C1730;
    --vino-claro: #D93F58;
    --sombra-2: 0 1px 2px rgba(28,25,23,0.04), 0 8px 24px -10px rgba(28,25,23,0.12);
    --radio: 16px;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--crema); color: var(--texto); margin: 0; padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .banda { height: 4px; background: linear-gradient(90deg, var(--vino), var(--vino-claro)); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 44px 18px 28px; }

  .marca { text-align: center; margin-bottom: 28px; }
  .marca img { width: 210px; max-width: 68%; }

  .card {
    background: var(--superficie); border-radius: var(--radio); padding: 34px 26px;
    border: 1px solid var(--linea); box-shadow: var(--sombra-2); text-align: center;
  }

  /* Engrane girando: el sistema esta en trabajo */
  .engrane { width: 62px; height: 62px; margin: 0 auto 20px; fill: var(--vino); animation: girar 6s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .engrane { animation: none; }
    .barra span { animation: none; background: var(--vino); }
  }

  h1 { font-size: 1.32rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 12px; color: var(--texto); }
  .mensaje { margin: 0 0 10px; color: var(--texto-2); font-size: 0.97rem; line-height: 1.6; }
  .nota { margin: 20px 0 0; font-size: 0.8rem; color: var(--texto-3); }

  /* Barra de avance indeterminada */
  .barra { position: relative; height: 4px; border-radius: 99px; background: var(--linea); overflow: hidden; margin: 26px 0 4px; }
  .barra span {
    position: absolute; inset: 0; border-radius: 99px;
    background: linear-gradient(90deg, rgba(190,29,56,0) 0%, var(--vino) 45%, var(--vino-claro) 60%, rgba(190,29,56,0) 100%);
    background-size: 220% 100%;
    animation: fluir 2.2s ease-in-out infinite;
  }
  @keyframes fluir { 0% { background-position: 100% 0; } 100% { background-position: -60% 0; } }

  .pie { text-align: center; font-size: 0.8rem; color: var(--texto-3); margin-top: 24px; line-height: 1.6; }

  .btn-wa {
    position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: #1FA855; box-shadow: 0 6px 20px -4px rgba(28,25,23,0.35);
    display: flex; align-items: center; justify-content: center; z-index: 10;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-wa:hover { background: #17914A; transform: translateY(-2px); box-shadow: 0 10px 26px -6px rgba(28,25,23,0.4); }
  .btn-wa svg { width: 30px; height: 30px; fill: #fff; }

  @media (max-width: 460px) {
    .wrap { padding: 32px 14px; }
    .card { padding: 28px 20px; }
  }
</style>
</head>
<body>
<div class="banda"></div>
<div class="wrap">

  <div class="marca">
    <img src="/logo-ft.svg" alt="Fletes Tauro" onerror="this.onerror=null;this.src='/logo-tauro.png'" />
  </div>

  <div class="card">
    <svg class="engrane" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19.4 13a7.8 7.8 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.6 7.6 0 0 0-1.7-1L14.5 2.4a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4L9.2 5.1c-.6.3-1.2.6-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.8 7.8 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.3 2.7c0 .2.3.4.5.4h4c.2 0 .5-.2.5-.4l.3-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/>
    </svg>

    <h1>Sitio en mantenimiento</h1>
    <p class="mensaje">Nuestra página de rastreo se encuentra en mantenimiento.</p>
    <p class="mensaje">Muy pronto podrás visualizar el estatus de tu envío. Estamos trabajando en ello, por favor espéranos.</p>

    <div class="barra" role="progressbar" aria-label="Mantenimiento en progreso"><span></span></div>

    <p class="nota">Gracias por tu paciencia y preferencia.</p>
  </div>

  <p class="pie">Si necesitas información de tu envío, contáctanos por WhatsApp.</p>
</div>

<a class="btn-wa" href="https://wa.me/528116362186?text=Hola%2C%20necesito%20informaci%C3%B3n%20de%20mi%20env%C3%ADo." target="_blank" rel="noopener" title="Escríbenos por WhatsApp" aria-label="Escríbenos por WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 2.7C8.7 2.7 2.8 8.6 2.8 15.9c0 2.3.6 4.6 1.8 6.6L2.7 29.3l7-1.8c1.9 1 4.1 1.6 6.3 1.6 7.3 0 13.2-5.9 13.2-13.2S23.3 2.7 16 2.7zm0 24.1c-2 0-3.9-.5-5.6-1.5l-.4-.2-4.2 1.1 1.1-4-.3-.4c-1.1-1.8-1.7-3.9-1.7-6 0-6.1 5-11 11.1-11s11.1 4.9 11.1 11-5 11-11.1 11zm6.1-8.2c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.7.2-.2.3-.8 1.1-1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6-.1-.2-.7-1.8-1-2.4-.3-.6-.5-.5-.7-.6h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.7 5.9 5.2.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.2-.6-.4z"/></svg>
</a>
</body>
</html>
