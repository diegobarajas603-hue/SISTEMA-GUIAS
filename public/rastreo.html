<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rastrea tu envío - Fletes Tauro</title>
<style>
  /* Paleta calida del panel (papel y cuero), pero con el rojo y el verde mas
     vivos: esta es la pagina del cliente y necesita transmitir energia y
     confianza, no la sobriedad de una herramienta interna. */
  :root {
    --crema: #F6F4F1;
    --superficie: #FFFFFF;
    --linea: #E6E1DA;
    --linea-suave: #F0EDE8;
    --texto: #1C1917;
    --texto-2: #57534E;
    --texto-3: #8B847C;
    --negro: #14120F;
    /* Rojo carmin: vivo y con presencia, sin el tono de alarma del original */
    --vino: #BE1D38;
    --vino-hover: #9C1730;
    --vino-claro: #D93F58;
    --vino-tinte: #FDF2F4;
    --vino-borde: #F4D2D8;
    /* Verde esmeralda: el color de "entregado", que da seguridad al cliente */
    --bosque: #0E8C45;
    --bosque-claro: #16A757;
    --sombra-2: 0 1px 2px rgba(28,25,23,0.04), 0 8px 24px -10px rgba(28,25,23,0.12);
    --radio: 16px;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--crema); color: var(--texto); margin: 0; padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--vino-claro); outline-offset: 2px; border-radius: 4px; }
  .banda { height: 4px; background: linear-gradient(90deg, var(--vino), var(--vino-claro)); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 34px 18px 28px; }

  .marca { text-align: center; margin-bottom: 26px; }
  .marca img { width: 210px; max-width: 68%; }
  .marca p { margin: 12px 0 0; color: var(--texto-2); font-size: 0.92rem; letter-spacing: 0.01em; }

  .card {
    background: var(--superficie); border-radius: var(--radio); padding: 22px;
    border: 1px solid var(--linea); box-shadow: var(--sombra-2); margin-bottom: 16px;
  }
  .buscador { display: flex; gap: 9px; }
  input[type=text] {
    flex: 1; padding: 14px 16px; font-size: 1.02rem; border-radius: 12px;
    border: 1px solid var(--linea); color: var(--texto); background: var(--superficie);
    font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=text]:focus { outline: none; border-color: var(--vino-claro); box-shadow: 0 0 0 3px rgba(190,29,56,0.13); }
  input::placeholder { color: #A8A199; }
  button {
    padding: 14px 26px; font-size: 0.86rem; font-weight: 600; letter-spacing: 0.09em;
    text-transform: uppercase; border-radius: 12px; border: none;
    background: var(--vino); color: #fff; cursor: pointer;
    box-shadow: 0 1px 2px rgba(28,25,23,0.12), inset 0 1px 0 rgba(255,255,255,0.12);
    transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  button:hover { background: var(--vino-hover); box-shadow: 0 6px 18px -6px rgba(190,29,56,0.45); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { background: #E0A9B3; cursor: wait; transform: none; box-shadow: none; }

  #resultado { display: none; }
  .estatus-grande { font-size: 1.22rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 3px; color: var(--texto); }
  .guia-num { margin: 0 0 12px; color: var(--texto-3); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .mensaje { margin: 0; color: var(--texto-2); font-size: 0.96rem; line-height: 1.55; }
  .actualizado { margin: 14px 0 0; font-size: 0.78rem; color: var(--texto-3); }

  /* Barra de progreso del envio */
  .stepper { display: flex; margin: 26px 0 10px; }
  .paso { flex: 1; text-align: center; position: relative; }
  .paso::before { content: ''; position: absolute; top: 18px; left: -50%; width: 100%; height: 3px; border-radius: 99px; background: var(--linea); z-index: 0; }
  .paso:first-child::before { display: none; }
  .paso.hecho::before, .paso.actual::before { background: var(--bosque-claro); }
  /* Tramo hacia el siguiente proceso: se ve avanzando (cargando) */
  .paso.cargando::before {
    background: linear-gradient(90deg, var(--bosque-claro) 0%, #7BD9A4 32%, var(--linea) 55%, var(--linea) 100%);
    background-size: 220% 100%;
    animation: fluir 2.2s ease-in-out infinite;
  }
  @keyframes fluir { 0% { background-position: 100% 0; } 100% { background-position: 0% 0; } }
  .paso .circulo {
    position: relative; z-index: 1; width: 38px; height: 38px; margin: 0 auto 10px; border-radius: 50%;
    background: var(--superficie); border: 1px solid var(--linea); color: var(--texto-3);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem;
    transition: background 0.3s;
  }
  .paso.hecho .circulo { background: var(--bosque); border-color: var(--bosque); color: #fff; box-shadow: 0 2px 10px rgba(14,140,69,0.35); }
  .paso.actual .circulo { background: var(--bosque); border-color: var(--bosque); color: #fff; animation: pulso 1.8s ease-in-out infinite; }
  @keyframes pulso { 0%, 100% { box-shadow: 0 0 0 4px rgba(14,140,69,0.28); } 50% { box-shadow: 0 0 0 12px rgba(14,140,69,0.05); } }
  .paso .nombre { font-size: 0.75rem; font-weight: 600; color: var(--texto-3); line-height: 1.25; }
  .paso.hecho .nombre, .paso.actual .nombre { color: var(--texto); }

  .error { display: none; background: var(--vino-tinte); border: 1px solid var(--vino-borde); color: var(--vino); border-radius: 12px; padding: 15px 17px; margin-bottom: 16px; font-size: 0.92rem; }

  h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.13em; color: var(--texto-3); margin: 0 0 16px; font-weight: 600; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { position: relative; padding: 0 0 20px 28px; border-left: 1px solid var(--linea); margin-left: 8px; }
  .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline li::before { content: ''; position: absolute; left: -6px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: #CFC8BF; border: 2px solid var(--superficie); box-shadow: 0 0 0 1px var(--linea); }
  .timeline li.e-salida::before, .timeline li.e-llegada::before, .timeline li.e-ruta::before,
  .timeline li.e-entrega::before { background: var(--bosque-claro); box-shadow: 0 0 0 1px var(--bosque-claro); }
  .timeline .desc { font-size: 0.93rem; color: var(--texto); line-height: 1.5; }
  .timeline .fecha { font-size: 0.76rem; color: var(--texto-3); margin-top: 3px; }

  .pie { text-align: center; font-size: 0.8rem; color: var(--texto-3); margin-top: 24px; line-height: 1.6; }

  .btn-wa {
    position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: #1FA855; box-shadow: 0 6px 20px -4px rgba(28,25,23,0.35);
    display: none; align-items: center; justify-content: center; z-index: 10;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-wa:hover { background: #17914A; transform: translateY(-2px); box-shadow: 0 10px 26px -6px rgba(28,25,23,0.4); }
  .btn-wa svg { width: 30px; height: 30px; fill: #fff; }

  @media (max-width: 460px) {
    .wrap { padding: 24px 14px; }
    .card { padding: 18px; }
    .buscador { flex-direction: column; }
    button { width: 100%; }
    .paso .nombre { font-size: 0.68rem; }
  }

</style>
</head>
<body>
<div class="banda"></div>
<div class="wrap">

  <div class="marca">
    <img src="/logo-ft.svg" alt="Fletes Tauro" onerror="this.onerror=null;this.src='/logo-tauro.png'" />
    <p>Rastrea tu envío Monterrey &harr; Ciudad de México</p>
  </div>

  <div class="card">
    <div class="buscador">
      <input type="text" id="guia" placeholder="Escribe tu número de guía" autocomplete="off" autofocus />
      <button id="btnBuscar" onclick="rastrear()">Rastrear</button>
    </div>
  </div>

  <div class="error" id="error"></div>

  <div class="card" id="resultado">
    <p class="estatus-grande" id="resEstatus"></p>
    <p class="guia-num" id="resGuia"></p>
    <p class="mensaje" id="resMensaje"></p>
    <div class="stepper" id="stepper"></div>
    <p class="actualizado" id="resActualizado"></p>
  </div>

  <div class="card" id="cardHistorial" style="display:none">
    <h2>Historial del envío</h2>
    <ul class="timeline" id="historial"></ul>
  </div>

  <p class="pie">Si tienes dudas sobre tu envío, contáctanos por WhatsApp.</p>
</div>

<a class="btn-wa" id="btnWa" href="#" target="_blank" rel="noopener" title="Escríbenos por WhatsApp" aria-label="Escríbenos por WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 2.7C8.7 2.7 2.8 8.6 2.8 15.9c0 2.3.6 4.6 1.8 6.6L2.7 29.3l7-1.8c1.9 1 4.1 1.6 6.3 1.6 7.3 0 13.2-5.9 13.2-13.2S23.3 2.7 16 2.7zm0 24.1c-2 0-3.9-.5-5.6-1.5l-.4-.2-4.2 1.1 1.1-4-.3-.4c-1.1-1.8-1.7-3.9-1.7-6 0-6.1 5-11 11.1-11s11.1 4.9 11.1 11-5 11-11.1 11zm6.1-8.2c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.7.2-.2.3-.8 1.1-1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6-.1-.2-.7-1.8-1-2.4-.3-.6-.5-.5-.7-.6h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.7 5.9 5.2.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.2-.6-.4z"/></svg>
</a>

<script>
  const $ = (id) => document.getElementById(id);

  // Numero de WhatsApp para dudas de clientes (formato internacional, sin
  // espacios ni signos; ej. Mexico: 5281XXXXXXXX). Si se deja vacio, el
  // boton flotante no se muestra.
  const WHATSAPP_NUMERO = '528116362186';

  function actualizarBotonWa(numeroGuia) {
    if (!WHATSAPP_NUMERO) return;
    const texto = numeroGuia
      ? `Hola, tengo una duda sobre mi envio ${numeroGuia}.`
      : 'Hola, tengo una duda sobre mi envio.';
    $('btnWa').href = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(texto)}`;
    $('btnWa').style.display = 'flex';
  }
  actualizarBotonWa(null);

  const ETIQUETAS = {
    EN_TRANSITO_A_CDMX: 'En tránsito',
    EN_TRANSITO_A_MTY: 'En tránsito',
    EN_BODEGA_CDMX: 'Recibido en sucursal',
    EN_BODEGA_MTY: 'Recibido en sucursal',
    EN_RUTA_ENTREGA_CDMX: 'En proceso de entrega',
    EN_RUTA_ENTREGA_MTY: 'En proceso de entrega',
    ENTREGADO_CDMX: 'Envío entregado',
    ENTREGADO_MTY: 'Envío entregado',
  };

  const DETALLES = {
    EN_TRANSITO_A_CDMX: 'Tu envío se encuentra en ruta hacia nuestro centro de distribución.',
    EN_TRANSITO_A_MTY: 'Tu envío se encuentra en ruta hacia nuestro centro de distribución.',
    EN_BODEGA_CDMX: 'Tu envío fue recibido en nuestra sucursal y está siendo preparado para su siguiente etapa.',
    EN_BODEGA_MTY: 'Tu envío fue recibido en nuestra sucursal y está siendo preparado para su siguiente etapa.',
    EN_RUTA_ENTREGA_CDMX: 'Tu envío se encuentra en ruta hacia la dirección de entrega.',
    EN_RUTA_ENTREGA_MTY: 'Tu envío se encuentra en ruta hacia la dirección de entrega.',
    ENTREGADO_CDMX: 'El envío fue entregado correctamente. Gracias por confiar en Fletes Tauro.',
    ENTREGADO_MTY: 'El envío fue entregado correctamente. Gracias por confiar en Fletes Tauro.',
  };

  function claseEstatus(estatus) {
    if (estatus.startsWith('EN_BODEGA') || estatus.startsWith('ENTREGADO')) return 'e-bodega';
    if (estatus.startsWith('EN_RUTA_ENTREGA')) return 'e-ruta';
    return 'e-transito';
  }

  // Barra de progreso: 4 etapas del envio. El indice "actual" indica cuantas
  // ya se completaron (las anteriores llevan check, esa es la etapa en curso).
  const PASOS = ['En tránsito', 'Recibido en sucursal', 'En proceso de entrega', 'Entregado'];

  function pasoActual(estatus) {
    if (estatus.startsWith('ENTREGADO')) return 4; // todas completas
    if (estatus.startsWith('EN_RUTA_ENTREGA')) return 2;
    if (estatus.startsWith('EN_BODEGA')) return 1;
    return 0; // EN_TRANSITO
  }

  function pintarStepper(estatus) {
    const actual = pasoActual(estatus);
    $('stepper').innerHTML = PASOS.map((nombre, i) => {
      // El tramo que llega al paso siguiente al actual se anima como si
      // estuviera cargando: el envio va avanzando hacia ese proceso
      const clase = i < actual ? 'hecho' : i === actual ? 'actual' : i === actual + 1 ? 'cargando' : '';
      const marca = i < actual ? '✓' : i + 1;
      return `<div class="paso ${clase}">
        <div class="circulo">${marca}</div>
        <div class="nombre">${nombre}</div>
      </div>`;
    }).join('');
  }

  // Nombre de cada plaza como lo ve el cliente
  const NOMBRE_PLAZA = { MTY: 'Monterrey', CDMX: 'Tlalnepantla, Estado de México' };

  const EVENTOS = [
    [/^Salio de bodega (MTY|CDMX) con destino a (MTY|CDMX)/, (m) => `El envío salió de ${NOMBRE_PLAZA[m[1]]} con destino a ${NOMBRE_PLAZA[m[2]]}.`],
    [/^Llego a bodega (MTY|CDMX)/, (m) => `El envío fue recibido en nuestra sucursal de ${NOMBRE_PLAZA[m[1]]}.`],
    [/^Regreso a bodega (MTY|CDMX)/, (m) => `El envío regresó a nuestra sucursal de ${NOMBRE_PLAZA[m[1]]}.`],
    [/^Paquete en ruta de entrega en (MTY|CDMX)/, () => 'El envío se encuentra en proceso de entrega.'],
    [/^Entregado a domicilio en (MTY|CDMX)/, () => 'Entrega realizada con éxito.'],
    [/^Entregado en ocurre \(bodega (MTY|CDMX)\)/, () => 'Entrega realizada con éxito.'],
    // Textos de versiones anteriores del sistema
    [/Llego a bodega de Ciudad de Mexico/, () => `El envío fue recibido en nuestra sucursal de ${NOMBRE_PLAZA.CDMX}.`],
    [/Llego a bodega de Monterrey/, () => `El envío fue recibido en nuestra sucursal de ${NOMBRE_PLAZA.MTY}.`],
    [/salio de Monterrey|hacia Ciudad de Mexico$/, () => `El envío salió de ${NOMBRE_PLAZA.MTY} con destino a ${NOMBRE_PLAZA.CDMX}.`],
    [/salio de Ciudad de Mexico|hacia Monterrey$/, () => `El envío salió de ${NOMBRE_PLAZA.CDMX} con destino a ${NOMBRE_PLAZA.MTY}.`],
  ];

  function textoEvento(desc, accion) {
    if (desc) {
      for (const [re, fn] of EVENTOS) {
        const m = desc.match(re);
        if (m) return fn(m);
      }
      return desc;
    }
    return accion === 'SALIDA' ? 'El envío salió de nuestra sucursal.' : 'El envío fue recibido en nuestra sucursal.';
  }

  function fmtFecha(f) {
    return new Date(f).toLocaleString('es-MX', {
      day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
    });
  }

  function mostrarError(texto) {
    $('resultado').style.display = 'none';
    $('cardHistorial').style.display = 'none';
    $('error').textContent = texto;
    $('error').style.display = 'block';
  }

  async function rastrear() {
    const numeroGuia = $('guia').value.trim().toUpperCase();
    if (!numeroGuia) return;
    $('error').style.display = 'none';
    $('btnBuscar').disabled = true;
    try {
      const res = await fetch('/api/publico/guias/' + encodeURIComponent(numeroGuia));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No pudimos consultar tu guía, intenta más tarde.');

      $('resEstatus').textContent = ETIQUETAS[data.estatus] || data.estatus;
      $('resEstatus').className = 'estatus-grande ' + claseEstatus(data.estatus);
      $('resGuia').textContent = 'Guía: ' + data.numeroGuia + (data.complemento ? ' · Complemento: ' + data.complemento : '');
      $('resMensaje').textContent = DETALLES[data.estatus] || data.mensaje;
      pintarStepper(data.estatus);
      $('resActualizado').textContent = 'Última actualización: ' + fmtFecha(data.actualizado_en);
      $('resultado').style.display = 'block';

      $('historial').innerHTML = data.historial
        .map((ev) => {
          const clase =
            { SALIDA: 'e-salida', LLEGADA: 'e-llegada', RUTA_ENTREGA: 'e-ruta', ENTREGA: 'e-llegada' }[ev.accion] ||
            'e-llegada';
          return `<li class="${clase}">
            <div class="desc">${textoEvento(ev.descripcion, ev.accion)}</div>
            <div class="fecha">${fmtFecha(ev.creado_en)}</div>
          </li>`;
        })
        .join('');
      $('cardHistorial').style.display = data.historial.length ? 'block' : 'none';
      actualizarBotonWa(data.numeroGuia);
    } catch (e) {
      mostrarError(e.message);
    } finally {
      $('btnBuscar').disabled = false;
    }
  }

  $('guia').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') rastrear();
  });

  // Permite enlaces directos: /rastreo.html?guia=TAU-1001
  const param = new URLSearchParams(location.search).get('guia');
  if (param) {
    $('guia').value = param;
    rastrear();
  }
</script>
</body>
</html>
