<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rastrea tu envío - Fletes Tauro</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; margin: 0; padding: 0; }
  .banda { height: 6px; background: #d92027; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 26px 16px; }

  /* La marca entra en grande: es lo primero que ve el cliente. Al mostrarse
     un resultado el body pasa a .compacto y el logo se encoge para cederle
     el protagonismo al estatus de la guia, sin desaparecer del todo. */
  .marca { text-align: center; margin-bottom: 22px; transition: margin-bottom 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
  .marca img { width: 300px; max-width: 85%; transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
  .marca p { margin: 8px 0 0; color: #6b6b6b; font-size: 0.95rem; transition: opacity 0.3s, max-height 0.45s, margin 0.45s; max-height: 40px; overflow: hidden; }

  body.compacto .marca { margin-bottom: 16px; }
  body.compacto .marca img { width: 120px; }
  body.compacto .marca p { opacity: 0; max-height: 0; margin-top: 0; }

  .card { background: #fff; border-radius: 14px; padding: 20px; border: 1px solid #ececee; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.05); margin-bottom: 14px; }
  .buscador { display: flex; gap: 8px; }
  /* min-width:0 deja que el campo se encoja de verdad dentro del flex; sin
     eso conserva el ancho de su placeholder y empuja al boton fuera de la
     pantalla en celulares angostos. */
  input[type=text] { flex: 1; min-width: 0; padding: 13px 14px; font-size: 1.05rem; border-radius: 10px; border: 1.5px solid #cfcfcf; color: #1a1a1a; }
  input[type=text]:focus { outline: none; border-color: #d92027; box-shadow: 0 0 0 3px rgba(217,32,39,0.12); }
  button { padding: 13px 24px; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 10px; border: none; background: #d92027; color: #fff; cursor: pointer; }
  button:hover { background: #b31a20; }
  button:disabled { background: #e58a8d; cursor: wait; }

  /* Tarjeta del estatus: es la respuesta que vino a buscar el cliente, asi
     que se muestra mas grande y con mas aire que el resto. */
  #resultado { display: none; border-top: 5px solid #d92027; padding: 18px 20px 15px; }
  #resultado.aparece { animation: aparecer 0.45s cubic-bezier(0.4, 0, 0.2, 1) both; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .guia-num { margin: 0 0 5px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9a9a9a; font-variant-numeric: tabular-nums; }
  .estatus-grande { font-size: 1.65rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 6px; color: #1a1a1a; }
  /* Punto de color: da el estado de un vistazo, antes de leer el texto */
  .estatus-grande::before {
    content: ''; display: inline-block; width: 13px; height: 13px; border-radius: 50%;
    margin-right: 11px; vertical-align: middle; background: #9a9a9a;
  }
  .estatus-grande.e-transito::before { background: #e0a400; animation: latir 1.8s ease-in-out infinite; }
  .estatus-grande.e-ruta::before { background: #2563eb; animation: latir 1.8s ease-in-out infinite; }
  .estatus-grande.e-bodega::before { background: #1e7d32; }
  @keyframes latir { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0.18); } 50% { box-shadow: 0 0 0 7px rgba(0,0,0,0); } }

  .mensaje { margin: 0; color: #4b4b4b; font-size: 1rem; line-height: 1.45; }
  .actualizado { margin: 9px 0 0; font-size: 0.8rem; color: #9a9a9a; }

  @media (prefers-reduced-motion: reduce) {
    .marca, .marca img, .marca p { transition: none; }
    #resultado.aparece { animation: none; }
    .estatus-grande::before, .paso.cargando::before, .paso.actual .circulo { animation: none; }
  }

  /* Linea de tiempo del envio. Cada etapa es un nodo con su icono (camion,
     paquete, ubicacion y casa) unido por una linea fina: continua en verde
     donde el envio ya paso y punteada en gris donde falta. */
  .stepper { display: flex; margin: 16px 0 2px; }
  .paso { flex: 1; text-align: center; position: relative; }
  .paso::before {
    content: ''; position: absolute; top: 17px; left: -50%; width: 100%; height: 2px; z-index: 0;
    background-image: repeating-linear-gradient(90deg, #d8d8dc 0 4px, transparent 4px 9px);
  }
  .paso:first-child::before { display: none; }
  .paso.hecho::before, .paso.actual::before { background-image: none; background-color: #1e7d32; }
  /* Tramo hacia el siguiente proceso: los puntos avanzan hacia esa etapa */
  .paso.cargando::before {
    background-image: repeating-linear-gradient(90deg, #1e7d32 0 4px, transparent 4px 9px);
    animation: fluir 1.6s linear infinite;
  }
  @keyframes fluir { from { background-position: 0 0; } to { background-position: 9px 0; } }

  .paso .circulo {
    position: relative; z-index: 1; width: 36px; height: 36px; margin: 0 auto 9px;
    border-radius: 50%; background: #fff; border: 1.5px solid #e2e2e6;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s, border-color 0.3s;
  }
  .paso .circulo svg { width: 18px; height: 18px; fill: #c2c2c8; transition: fill 0.3s; }
  .paso.hecho .circulo, .paso.actual .circulo { background: #1e7d32; border-color: #1e7d32; }
  .paso.hecho .circulo svg, .paso.actual .circulo svg { fill: #fff; }
  .paso.actual .circulo { animation: pulso 2s ease-in-out infinite; }
  @keyframes pulso { 0%, 100% { box-shadow: 0 0 0 0 rgba(30,125,50,0.30); } 50% { box-shadow: 0 0 0 8px rgba(30,125,50,0); } }
  .paso .nombre { font-size: 0.72rem; font-weight: 600; color: #8a8a92; line-height: 1.25; }
  .paso.hecho .nombre, .paso.actual .nombre { color: #1a1a1a; font-weight: 700; }

  .error { display: none; background: #fdecec; border: 1.5px solid #d92027; color: #a31419; border-radius: 4px; padding: 14px 16px; margin-bottom: 14px; }

  h2 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8a8a; margin: 0 0 12px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { position: relative; padding: 0 0 18px 26px; border-left: 2px solid #e5e5e5; margin-left: 8px; }
  .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline li::before { content: ''; position: absolute; left: -8px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #cfcfcf; }
  .timeline li.e-salida::before, .timeline li.e-llegada::before, .timeline li.e-ruta::before { background: #1e7d32; }
  .timeline .desc { font-size: 0.95rem; color: #1a1a1a; }
  .timeline .fecha { font-size: 0.78rem; color: #9a9a9a; margin-top: 2px; }

  .pie { text-align: center; font-size: 0.8rem; color: #9a9a9a; margin-top: 20px; }

  .btn-wa { position: fixed; right: 18px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; background: #25d366; box-shadow: 0 3px 10px rgba(0,0,0,0.25); display: none; align-items: center; justify-content: center; z-index: 10; }
  .btn-wa:hover { background: #1fb857; }
  .btn-wa svg { width: 32px; height: 32px; fill: #fff; }

  /* En celulares angostos el buscador se apila: el campo y el boton a lo
     ancho, en vez de competir por el mismo renglon. */
  @media (max-width: 420px) {
    .buscador { flex-direction: column; }
    button { width: 100%; }
    .paso .nombre { font-size: 0.68rem; }
  }
</style>
</head>
<body>
<div class="banda"></div>
<div class="wrap">

  <div class="marca">
    <img src="/logo-tauro.svg" alt="Fletes Tauro" />
    <p>Rastrea tu envío Monterrey &harr; Ciudad de México</p>
  </div>

  <div class="card">
    <div class="buscador">
      <input type="text" id="guia" placeholder="Escribe tu número de guía" autocomplete="off" autofocus />
      <button id="btnBuscar" onclick="rastrear()">Rastrear</button>
    </div>
  </div>

  <div class="error" id="error"></div>

  <div class="card" id="resultado">
    <p class="guia-num" id="resGuia"></p>
    <p class="estatus-grande" id="resEstatus"></p>
    <p class="mensaje" id="resMensaje"></p>
    <div class="stepper" id="stepper"></div>
    <p class="actualizado" id="resActualizado"></p>
  </div>

  <div class="card" id="cardHistorial" style="display:none">
    <h2>Historial del envío</h2>
    <ul class="timeline" id="historial"></ul>
  </div>

  <p class="pie">Si tienes dudas sobre tu envío, contáctanos por WhatsApp.</p>
</div>

<a class="btn-wa" id="btnWa" href="#" target="_blank" rel="noopener" title="Escríbenos por WhatsApp" aria-label="Escríbenos por WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 2.7C8.7 2.7 2.8 8.6 2.8 15.9c0 2.3.6 4.6 1.8 6.6L2.7 29.3l7-1.8c1.9 1 4.1 1.6 6.3 1.6 7.3 0 13.2-5.9 13.2-13.2S23.3 2.7 16 2.7zm0 24.1c-2 0-3.9-.5-5.6-1.5l-.4-.2-4.2 1.1 1.1-4-.3-.4c-1.1-1.8-1.7-3.9-1.7-6 0-6.1 5-11 11.1-11s11.1 4.9 11.1 11-5 11-11.1 11zm6.1-8.2c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.7.2-.2.3-.8 1.1-1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6-.1-.2-.7-1.8-1-2.4-.3-.6-.5-.5-.7-.6h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.7 5.9 5.2.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.2-.6-.4z"/></svg>
</a>

<script>
  const $ = (id) => document.getElementById(id);

  // Numero de WhatsApp para dudas de clientes (formato internacional, sin
  // espacios ni signos; ej. Mexico: 5281XXXXXXXX). Si se deja vacio, el
  // boton flotante no se muestra.
  const WHATSAPP_NUMERO = '528116362186';

  function actualizarBotonWa(numeroGuia) {
    if (!WHATSAPP_NUMERO) return;
    const texto = numeroGuia
      ? `Hola, tengo una duda sobre mi envio ${numeroGuia}.`
      : 'Hola, tengo una duda sobre mi envio.';
    $('btnWa').href = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(texto)}`;
    $('btnWa').style.display = 'flex';
  }
  actualizarBotonWa(null);

  const ETIQUETAS = {
    EN_TRANSITO_A_CDMX: 'En tránsito a CDMX',
    EN_TRANSITO_A_MTY: 'En tránsito a MTY',
    EN_BODEGA_CDMX: 'En bodega CDMX',
    EN_BODEGA_MTY: 'En bodega MTY',
    EN_RUTA_ENTREGA_CDMX: 'En ruta de entrega',
    EN_RUTA_ENTREGA_MTY: 'En ruta de entrega',
    ENTREGADO_CDMX: 'Entregado',
    ENTREGADO_MTY: 'Entregado',
  };

  const DETALLES = {
    EN_TRANSITO_A_CDMX: 'Tu envío salió de bodega MTY y está en tránsito hacia CDMX.',
    EN_TRANSITO_A_MTY: 'Tu envío salió de bodega CDMX y está en tránsito hacia MTY.',
    EN_BODEGA_CDMX: 'Tu envío llegó a bodega CDMX y está listo.',
    EN_BODEGA_MTY: 'Tu envío llegó a bodega MTY y está listo.',
    EN_RUTA_ENTREGA_CDMX: 'Tu paquete está en ruta de entrega en CDMX.',
    EN_RUTA_ENTREGA_MTY: 'Tu paquete está en ruta de entrega en MTY.',
    ENTREGADO_CDMX: 'Tu envío fue entregado. Gracias por tu preferencia.',
    ENTREGADO_MTY: 'Tu envío fue entregado. Gracias por tu preferencia.',
  };

  function claseEstatus(estatus) {
    if (estatus.startsWith('EN_BODEGA') || estatus.startsWith('ENTREGADO')) return 'e-bodega';
    if (estatus.startsWith('EN_RUTA_ENTREGA')) return 'e-ruta';
    return 'e-transito';
  }

  // Iconos de la linea de tiempo. Van en el HTML y no como archivos aparte
  // para que el estatus se pinte de una sola vez, sin peticiones extra.
  const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  const ICONOS = {
    // Camion de reparto: el envio viaja entre plazas
    camion: svg('M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'),
    // Caja: el paquete esperando en bodega
    caja: svg('M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z'),
    // Pin de ubicacion: el paquete ya va en la calle hacia el domicilio
    ubicacion: svg('M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z'),
    // Casa: el envio llego a su destino
    casa: svg('M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z'),
  };

  // Linea de tiempo: 4 etapas del envio. El indice "actual" indica cuantas
  // ya se completaron (esa es la etapa en curso).
  const PASOS = [
    { nombre: 'En camino', icono: ICONOS.camion },
    { nombre: 'En bodega', icono: ICONOS.caja },
    { nombre: 'En reparto', icono: ICONOS.ubicacion },
    { nombre: 'Entregado', icono: ICONOS.casa },
  ];

  function pasoActual(estatus) {
    if (estatus.startsWith('ENTREGADO')) return 4; // todas completas
    if (estatus.startsWith('EN_RUTA_ENTREGA')) return 2;
    if (estatus.startsWith('EN_BODEGA')) return 1;
    return 0; // EN_TRANSITO
  }

  function pintarStepper(estatus) {
    const actual = pasoActual(estatus);
    $('stepper').innerHTML = PASOS.map((paso, i) => {
      // El tramo que llega al paso siguiente al actual se anima como si
      // estuviera cargando: el envio va avanzando hacia ese proceso
      const clase = i < actual ? 'hecho' : i === actual ? 'actual' : i === actual + 1 ? 'cargando' : '';
      return `<div class="paso ${clase}">
        <div class="circulo">${paso.icono}</div>
        <div class="nombre">${paso.nombre}</div>
      </div>`;
    }).join('');
  }

  const EVENTOS = [
    [/^Salio de bodega (MTY|CDMX) con destino a (MTY|CDMX)/, (m) => `Salió de bodega ${m[1]} con destino a ${m[2]}`],
    [/^Llego a bodega (MTY|CDMX)/, (m) => `Llegó a bodega ${m[1]}`],
    [/^Regreso a bodega (MTY|CDMX)/, (m) => `Regresó a bodega ${m[1]} (entrega no completada)`],
    [/^Entregado a domicilio en (MTY|CDMX)/, (m) => `Entregado a domicilio en ${m[1]}`],
    [/^Entregado en ocurre \(bodega (MTY|CDMX)\)/, (m) => `Entregado en bodega ${m[1]} (ocurre)`],
    // Textos de versiones anteriores del sistema
    [/Llego a bodega de Ciudad de Mexico/, () => 'Llegó a bodega CDMX'],
    [/Llego a bodega de Monterrey/, () => 'Llegó a bodega MTY'],
    [/salio de Monterrey|hacia Ciudad de Mexico$/, () => 'Salió de bodega MTY con destino a CDMX'],
    [/salio de Ciudad de Mexico|hacia Monterrey$/, () => 'Salió de bodega CDMX con destino a MTY'],
  ];

  function textoEvento(desc, accion) {
    if (desc) {
      for (const [re, fn] of EVENTOS) {
        const m = desc.match(re);
        if (m) return fn(m);
      }
      return desc;
    }
    return accion === 'SALIDA' ? 'Salió de bodega' : 'Llegó a bodega';
  }

  function fmtFecha(f) {
    return new Date(f).toLocaleString('es-MX', {
      day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
    });
  }

  function mostrarError(texto) {
    // Sin resultado que destacar, la marca vuelve a su tamano original
    document.body.classList.remove('compacto');
    $('resultado').style.display = 'none';
    $('cardHistorial').style.display = 'none';
    $('error').textContent = texto;
    $('error').style.display = 'block';
  }

  // Encoge la marca y anima la entrada de la tarjeta de estatus. La animacion
  // se reinicia a mano para que tambien se note al consultar una segunda guia
  // sin recargar la pagina.
  function mostrarResultado() {
    document.body.classList.add('compacto');
    const card = $('resultado');
    card.style.display = 'block';
    card.classList.remove('aparece');
    void card.offsetWidth;
    card.classList.add('aparece');
  }

  async function rastrear() {
    const numeroGuia = $('guia').value.trim().toUpperCase();
    if (!numeroGuia) return;
    $('error').style.display = 'none';
    $('btnBuscar').disabled = true;
    try {
      const res = await fetch('/api/publico/guias/' + encodeURIComponent(numeroGuia));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No pudimos consultar tu guía, intenta más tarde.');

      // El numero de guia pasa a ser el dato secundario: manda el estatus
      $('resGuia').textContent = 'Guía ' + data.numeroGuia;
      $('resEstatus').textContent = ETIQUETAS[data.estatus] || data.estatus;
      $('resEstatus').className = 'estatus-grande ' + claseEstatus(data.estatus);
      $('resMensaje').textContent = DETALLES[data.estatus] || data.mensaje;
      pintarStepper(data.estatus);
      $('resActualizado').textContent = 'Última actualización: ' + fmtFecha(data.actualizado_en);
      mostrarResultado();

      $('historial').innerHTML = data.historial
        .map((ev) => {
          const clase =
            { SALIDA: 'e-salida', LLEGADA: 'e-llegada', RUTA_ENTREGA: 'e-ruta', ENTREGA: 'e-llegada' }[ev.accion] ||
            'e-llegada';
          return `<li class="${clase}">
            <div class="desc">${textoEvento(ev.descripcion, ev.accion)}</div>
            <div class="fecha">${fmtFecha(ev.creado_en)}</div>
          </li>`;
        })
        .join('');
      $('cardHistorial').style.display = data.historial.length ? 'block' : 'none';
      actualizarBotonWa(data.numeroGuia);
    } catch (e) {
      mostrarError(e.message);
    } finally {
      $('btnBuscar').disabled = false;
    }
  }

  $('guia').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') rastrear();
  });

  // Permite enlaces directos: /rastreo.html?guia=TAU-1001
  const param = new URLSearchParams(location.search).get('guia');
  if (param) {
    $('guia').value = param;
    rastrear();
  }
</script>
</body>
</html>
